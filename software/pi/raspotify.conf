# Raspotify configuration for Vinyl Spotify Player

# Device name as it will appear in Spotify Connect
DEVICE_NAME="Vinyl Spotify Player"

# Bitrate (96, 160, or 320)
BITRATE="320"

# Audio backend (alsa, pulseaudio, pipe, etc.)
BACKEND="alsa"

# ALSA device (use "aplay -L" to list devices)
DEVICE="default"

# Mixer (software or ALSA mixer name)
MIXER="software"

# Volume normalization
VOLUME_NORMALISATION="false"

# Volume control (software, linear, log, or fixed)
VOLUME_CTRL="software"

# Initial volume (0-100)
INITIAL_VOLUME="75"

# Auto-play on startup
AUTOPLAY="false"

# Cache directory
CACHE="/var/cache/raspotify"

# Additional options
# OPTIONS="--disable-audio-cache"
