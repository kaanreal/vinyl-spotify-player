// Shairport Sync configuration for Jukebox
// Lines beginning with // or # are comments.
//
// Variable substitutions:
//   ${DEVICE_NAME}  — AirPlay device name
//   ${AUDIO_OUTPUT} — ALSA output device

general = {
    name = "${DEVICE_NAME}";
    // Ignore this device from the "allow" or "deny" lists
    // ignore_volume_control = "no";

    // How often to wait for audio before starting playback (seconds)
    // latency = 88200;
};

// Metadata pipe — shairport-sync writes raw metadata (including cover art)
// to this named pipe. The metadata_bridge.py service reads it.
metadata =
{
    enabled = "yes";
    // Include cover art in the metadata feed
    include_cover_art = "yes";
    // Write metadata events (pipe, stdout, or socket)
    pipe_name = "/tmp/shairport-sync-metadata";
};

// ALSA audio output backend
alsa =
{
    output_device = "${AUDIO_OUTPUT}";
    // Mixer control name for volume (empty = no hardware mixer)
    mixer_control_name = "PCM";
    // Allow the output device to be shared with other audio sources
    // output_rate = 44100;
};

// Enable volume control via MPRIS / D-Bus
// This lets playerctl and other tools control volume
sessioncontrol =
{
    // run_this_before_play = "...";
    // run_this_after_play = "...";
};
