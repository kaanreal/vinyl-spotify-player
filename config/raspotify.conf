# Raspotify configuration for Jukebox
# Environment variables prefixed with LIBRESPOT_ are passed to librespot.
#
# Variable substitutions:
#   ${DEVICE_NAME}  — Spotify Connect device name
#   ${AUDIO_OUTPUT} — ALSA output device

# The name shown in the Spotify "Connect to a device" menu
LIBRESPOT_NAME="${DEVICE_NAME}"

# Audio bitrate: 96, 160, or 320 kbps
LIBRESPOT_BITRATE="320"

# Audio backend: alsa, pulseaudio, or pipe
LIBRESPOT_BACKEND="alsa"

# ALSA output device (same as shairport-sync)
LIBRESPOT_DEVICE="${AUDIO_OUTPUT}"

# Automatically start playing when a track begins (no need to press play)
LIBRESPOT_AUTOPLAY="on"

# Enable zeroconf discovery so the device appears in Spotify without login
LIBRESPOT_DISABLE_DISCOVERY="off"
